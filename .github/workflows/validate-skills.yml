name: Validate Skills

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md files
        run: |
          errors=0
          count=0

          for dir in */; do
            skill_file="${dir}SKILL.md"
            [ ! -f "$skill_file" ] && continue

            count=$((count + 1))
            dir_name="${dir%/}"

            # Check YAML frontmatter exists
            if ! head -1 "$skill_file" | grep -q '^---$'; then
              echo "ERROR: $skill_file missing YAML frontmatter"
              errors=$((errors + 1))
              continue
            fi

            # Extract frontmatter
            frontmatter=$(sed -n '2,/^---$/p' "$skill_file" | head -n -1)

            # Check name field
            name=$(echo "$frontmatter" | grep '^name:' | sed 's/name: *//')
            if [ -z "$name" ]; then
              echo "ERROR: $skill_file missing 'name' field"
              errors=$((errors + 1))
            elif [ "$name" != "$dir_name" ]; then
              echo "ERROR: $skill_file name '$name' does not match directory '$dir_name'"
              errors=$((errors + 1))
            fi

            # Check description field
            description=$(echo "$frontmatter" | grep '^description:')
            if [ -z "$description" ]; then
              echo "ERROR: $skill_file missing 'description' field"
              errors=$((errors + 1))
            fi
          done

          echo ""
          echo "Validated $count skills, $errors errors"

          if [ $errors -gt 0 ]; then
            exit 1
          fi

  check-skill-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundled skill references are in sync
        run: bash scripts/sync-skill-references.sh --check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          # Version comes from .shellcheck-version, the single source both this
          # job and lefthook read. Deliberately not restated here — see
          # scripts/check-shellcheck-version.sh for the incident behind the pin.
          want="$(tr -d '[:space:]' < .shellcheck-version)"
          sudo apt-get update && sudo apt-get install -y shellcheck
          got="$(shellcheck --version | awk -F': ' '/^version:/ {print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::.shellcheck-version pins $want but the runner installed $got." \
                 "Update .shellcheck-version deliberately, or pin the install."
            exit 1
          fi

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync-skill-references test suite
        run: bash scripts/test-sync-references.sh

      - name: Bundled reference pointers resolve
        run: bash scripts/test-bundled-pointer-resolution.sh

      - name: Run verify-install test suite
        run: bash scripts/test-verify-install.sh

      - name: Run review-currency marker contract suite
        run: bash scripts/test-review-currency-marker.sh

      - name: Run review-dimension partition contract suite
        run: bash scripts/test-review-dimension-partition.sh

      - name: Run loop-ledger marker contract suite
        run: bash scripts/test-loop-ledger-markers.sh

      - name: Run Context-block contract suite
        run: bash scripts/test-context-block-contract.sh

      - name: Run selection-idiom consistency suite
        run: bash scripts/test-selection-idiom-consistency.sh

      - name: Run options-comparison contract suite
        run: bash scripts/test-options-comparison-contract.sh

      - name: Run documented git command contract suite
        run: bash scripts/test-documented-git-commands.sh

      - name: Run compound clustering single-source suite
        run: bash scripts/test-compound-clustering-single-source.sh

      - name: Run Q4 mechanism-name contract suite
        run: bash scripts/test-q4-mechanism-names.sh

      - name: Run oracle-table coverage suite
        run: bash scripts/test-oracle-table-coverage.sh

      - name: Run duplicate-guard-program contract suite
        run: bash scripts/test-duplicate-guard-programs.sh

      - name: Run widened-domain tell contract suite
        run: bash scripts/test-widened-domain-tell.sh

      - name: Run canon-coverage contract suite
        run: bash scripts/test-canon-coverage.sh
        # NOTE: this run SKIPS the rendered-page check — site/dist does not exist
        # here. The canon-render job below builds the site first so that check
        # runs on every PR. Both invocations are deliberate: this one is fast and
        # covers everything readable from source, that one is slow and is the only
        # reading that sees the page a visitor gets.

      - name: Run shellcheck version-parity contract suite
        run: bash scripts/test-shellcheck-version-parity.sh

      - name: Run absent-local-gate tell contract suite
        run: bash scripts/test-absent-local-gate-tells.sh

      # Measures git's own behavior in a scratch repo rather than reading a file
      # in this one, so it is the one suite here that can go red because the
      # runner's git changed rather than because this repo did. That is the
      # point: CLAUDE.md states what `diff=markdown` does and does not do, and
      # nothing else would notice if a future git made half of it false.
      - name: Run markdown diff-attribute contract suite
        run: bash scripts/test-markdown-diff-attribute.sh

  # The canon section is generated from `sources:` frontmatter (issue #273). Every
  # other check reads source files and reasons about what they would produce; this
  # one builds the site and reads what was produced, which is the difference
  # between "the component imports the canon" and "the reader can see all of it".
  canon-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - name: Run canon-coverage contract suite against the built page
        run: bash scripts/test-canon-coverage.sh
