name: Validate Skills

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md files
        run: bash scripts/check-skill-names.sh

  check-skill-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundled skill references are in sync
        run: bash scripts/sync-skill-references.sh --check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          # Version comes from .shellcheck-version, the single source both this
          # job and lefthook read. Deliberately not restated here — see
          # scripts/check-shellcheck-version.sh for the incident behind the pin.
          #
          # Installed from the upstream release for that version, not from apt.
          # The apt package follows the runner image: when ubuntu-latest moved to
          # 26.04 it began shipping a newer shellcheck than the pin, and this job
          # went red on prod with no change in the repo. The release asset is
          # the same one scripts/shellcheck-pinned.sh downloads for pre-push.
          want="$(tr -d '[:space:]' < .shellcheck-version)"
          dest="$RUNNER_TEMP/shellcheck-pinned"
          mkdir -p "$dest"
          curl -fsSL --retry 3 --max-time 60 \
            "https://github.com/koalaman/shellcheck/releases/download/v$want/shellcheck-v$want.linux.$(uname -m).tar.xz" \
            -o "$dest/sc.tar.xz"
          tar -xf "$dest/sc.tar.xz" -C "$dest" --strip-components=1 "shellcheck-v$want/shellcheck"
          rm -f "$dest/sc.tar.xz"
          echo "$dest" >> "$GITHUB_PATH"

      # A separate step, so it reads the PATH the lint step will use: the runner
      # image carries its own shellcheck, and a download that landed behind it
      # would lint with the wrong version and pass.
      - name: Confirm the pinned shellcheck is the one on PATH
        run: |
          want="$(tr -d '[:space:]' < .shellcheck-version)"
          got="$(shellcheck --version | awk -F': ' '/^version:/ {print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::.shellcheck-version pins $want but \`shellcheck\` on PATH is $got" \
                 "($(command -v shellcheck)). The install step above did not take effect."
            exit 1
          fi

      - name: Lint shell scripts
        run: git ls-files -z "*.sh" | xargs -0 shellcheck

  script-tests:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1 checkout: test-git-guardrails.sh
      # resolves two distinct real commits for its stale-stamp cases and exits 2
      # on a shallow clone, which had stopped this job before every later suite
      # ran (red on prod since #349). Repaired here because it hid whether the
      # two /excavate suites run at all in CI (#402).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The `validate` job above checks only that `name` matches the directory.
      # Whether the frontmatter loads at all is Claude Code's call, so this runs
      # its validator at the version .claude-code-version pins (#575: a quote
      # inside a quoted description shipped past every grep for six days).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@$(tr -d '[:space:]' < .claude-code-version)" --no-audit --no-fund

      - name: Run skill frontmatter load suite
        run: bash scripts/test-skill-frontmatter-loads.sh

      - name: Run sync-skill-references test suite
        run: bash scripts/test-sync-references.sh

      - name: Bundled reference pointers resolve
        run: bash scripts/test-bundled-pointer-resolution.sh

      - name: Run verify-install test suite
        run: bash scripts/test-verify-install.sh

      - name: Run review-currency marker contract suite
        run: bash scripts/test-review-currency-marker.sh

      - name: Run review-dimension partition contract suite
        run: bash scripts/test-review-dimension-partition.sh

      - name: Run restated review-operative contract suite
        run: bash scripts/test-restated-review-operatives.sh

      - name: Run loop-ledger marker contract suite
        run: bash scripts/test-loop-ledger-markers.sh

      - name: Run Context-block contract suite
        run: bash scripts/test-context-block-contract.sh

      - name: Run bare pack-reference suite
        run: bash scripts/test-bare-pack-refs.sh

      - name: Run flow-row read-contract suite
        run: bash scripts/test-flow-row-read-contract.sh

      - name: Run selection-idiom consistency suite
        run: bash scripts/test-selection-idiom-consistency.sh

      - name: Run options-comparison contract suite
        run: bash scripts/test-options-comparison-contract.sh

      - name: Run per-unit-series contract suite
        run: bash scripts/test-per-unit-series-contract.sh

      - name: Run documented git command contract suite
        run: bash scripts/test-documented-git-commands.sh

      - name: Run git guardrail contract suite
        run: bash scripts/test-git-guardrails.sh

      - name: Run compound clustering single-source suite
        run: bash scripts/test-compound-clustering-single-source.sh

      - name: Run Q4 mechanism-name contract suite
        run: bash scripts/test-q4-mechanism-names.sh

      - name: Run compound citation-anchor contract suite
        run: bash scripts/test-compound-citation-anchors.sh

      - name: Run oracle-table coverage suite
        run: bash scripts/test-oracle-table-coverage.sh

      - name: Run duplicate-guard-program contract suite
        run: bash scripts/test-duplicate-guard-programs.sh

      - name: Run widened-domain tell contract suite
        run: bash scripts/test-widened-domain-tell.sh

      - name: Run canon-coverage contract suite
        run: bash scripts/test-canon-coverage.sh
        # NOTE: this run SKIPS the rendered-page check — site/dist does not exist
        # here. The canon-render job below builds the site first so that check
        # runs on every PR. Both invocations are deliberate: this one is fast and
        # covers everything readable from source, that one is slow and is the only
        # reading that sees the page a visitor gets.

      - name: Run shellcheck version-parity contract suite
        run: bash scripts/test-shellcheck-version-parity.sh

      - name: Run absent-local-gate tell contract suite
        run: bash scripts/test-absent-local-gate-tells.sh

      # Measures git's own behavior in a scratch repo rather than reading a file
      # in this one, so it is the one suite here that can go red because the
      # runner's git changed rather than because this repo did. That is the
      # point: CLAUDE.md states what `diff=markdown` does and does not do, and
      # nothing else would notice if a future git made half of it false.
      - name: Run markdown diff-attribute contract suite
        run: bash scripts/test-markdown-diff-attribute.sh

      # CLAUDE.md gives reviewers a diff command that leaves out the generated
      # references/ copies. This runs it in a scratch repo and checks that a
      # hand-written file under references/ is still shown.
      - name: Run authored-diff pathspec suite
        run: bash scripts/test-authored-diff-pathspec.sh

      # A skill block that reads ${VAR:-} before assigning VAR defaults silently
      # in the fresh shell an agent runs it in. Allowlisted exceptions are named
      # in the script and fail once they stop matching.
      - name: Run block default-read suite
        run: bash scripts/test-block-default-reads.sh

      # The skill loader rewrites a bare $N in a SKILL.md body to the Nth
      # argument, inside code blocks too, so awk's $0 silently breaks.
      - name: Run skill argument-substitution suite
        run: bash scripts/test-skill-arg-substitution.sh

      # Executes the commands setup-pre-commit/SKILL.md documents for its
      # security gates (missing binary, unreachable registry, detection grep,
      # yaml shape). Needs neither gitleaks nor the network; an absent
      # lefthook or yq SKIPs its own assertion loudly.
      - name: Run setup-pre-commit gates contract suite
        run: bash scripts/test-setup-pre-commit-gates.sh

      # The mechanism for PR #296's escapes: a guard whose condition cannot
      # become true reports coverage while providing none, and is invisible in
      # exactly the way the defect it guards against is invisible.
      - name: Run guards-can-fire contract suite
        run: bash scripts/test-guards-can-fire.sh

      # The palette /visual-recap and /walk-commits copy is only copyable if it
      # covers the code being rendered. Where it did not, an agent invented a
      # token and repurposed another (#305) — while reading the rule forbidding
      # exactly that. Pins membership, symmetry, and that every token is shown
      # in use, which is the half a membership check alone would miss.
      - name: Run syntax-palette contract suite
        run: bash scripts/test-syntax-palette-contract.sh
      # #763: the token core carries its dark values twice (system-dark media
      # query and a pinned data-theme), so a recap reads right as a local file
      # and on a host that follows the viewer's theme. Pins the shape, that the
      # two copies match, and that the theme attribute lives on <html>.
      - name: Run theme-token shape suite
        run: bash scripts/test-theme-token-shape.sh
      # #307's drift class: an always-on surface contradicting the doc it points
      # at. The `description:` frontmatter is in every downstream session's
      # context window, and it announced a diagram default the canon no longer
      # states. Five copies of one rule, none of them the canon.
      - name: Run recap mode + diagram default contract suite
        run: bash scripts/test-recap-mode-contract.sh

      # The decision card (#317) is the second forward-looking block, and the
      # first one whose subject is a plan. Its grounding rule is weaker than
      # every other block's by necessity — a plan has no diff, so "derived by
      # tooling" is replaced by "cited or visibly asserted" — and a weaker rule
      # that goes unenforced degrades to no rule while still looking confident.
      - name: Run decision card grounding contract suite
        run: bash scripts/test-decision-card-grounding.sh

      # A framework callout's recall field is only worth rendering if Copy
      # feedback carries the attempt back. The markup names the field and core
      # §4's serializer reads it; this runs that serializer under node.
      - name: Run recall callout contract suite
        run: bash scripts/test-recall-callout-contract.sh

      # A callout names the decision-trail entry it serves; core §4's serializer
      # carries that reference. This runs the serializer under node and checks
      # the trail example's links and citations resolve.
      - name: Run decision trail contract suite
        run: bash scripts/test-decision-trail-contract.sh

      # /visual-recap's generator checklist: the placeholder check runs against
      # planted files, and the design's excerpt example marks every line-number
      # jump with a gap row (#765).
      - name: Run recap generator checklist suite
        run: bash scripts/test-recap-generator-checklist.sh

      # A reader-chosen palette is checked by names and contrast instead of
      # values; this runs both checks on the design's example and self-tests
      # each against a palette that must fail it (#764).
      - name: Run reader palette contract suite
        run: bash scripts/test-reader-palette-contract.sh

      # The sitting plan keeps per-reader state in browser storage; this runs
      # its script under node with working storage and with storage that
      # throws, and checks the example's links and rail lines (#762).
      - name: Run sitting plan contract suite
        run: bash scripts/test-sitting-plan-contract.sh

      # A committed instrument that fails while reporting normally is the defect
      # docs/solutions/testing-patterns/validate-the-instrument-not-only-the-
      # subject-2026-08-23.md recorded as prose. This is its mechanizable half:
      # `producer | grep -q` under pipefail answers "not found" for text that is
      # there, so a ban goes green precisely when the banned thing is present.
      - name: Run pipefail-safe matcher suite
        run: bash scripts/test-pipefail-safe-matchers.sh

      # ubuntu-latest ships without zsh. The post-review edit lock, state
      # backend, prd-to-issues, and multi-repo seam suites below run extracted skill blocks under
      # zsh and fail under CI rather than skipping that arm, so the shell is
      # installed before any of them runs.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # /visual-recap's multi-repo mode documents a block an agent runs in two
      # repositories at once; this runs it against two planted repos, and pins
      # the seam block's both-sides citation rule (#761). It runs the block
      # under zsh too, so it sits after the zsh install.
      - name: Run multi-repo seam contract suite
        run: bash scripts/test-multi-repo-seam-contract.sh

      # #327's lock is one hook clause plus four runnable blocks in four files,
      # and nothing executed any of it: `rg -l review-stamped scripts/` and
      # `rg -l "enforce-classification|IMPL_PATTERNS" scripts/` were both empty.
      # Its silent failure direction is a lock that never engages, which from
      # outside is indistinguishable from a branch nobody edited after review.
      - name: Run post-review edit lock contract suite
        run: bash scripts/test-post-review-edit-lock.sh

      # The classification-marker set is declared in four places — the hook's
      # first clause, /execute Step 6's `rm -f`, /init-pipeline § 6's reserved
      # list, and this repo's .gitignore — and none is derived from another.
      # Research for /lfg (2026-09-16) found nothing asserting the count Step 6
      # removes; a marker the removal misses outlives the review stamp, and one
      # a .gitignore misses is committable. Pass source files as arguments to
      # also scan their fenced bash blocks for markers no source declares.
      - name: Run classification-marker set contract suite
        run: bash scripts/test-lfg-marker.sh lfg/SKILL.md

      # #378: four skills decide "is this tree host-provisioned?" from the
      # environment. A bare CONDUCTOR_WORKSPACE_PATH leaks into shells and can
      # name another repo's workspace; this pins one shared containment block
      # across all four sites and executes it against a leaked-var scenario.
      - name: Run host-signal containment suite
        run: bash scripts/test-host-signal-containment.sh

      # #782: /execute Step 0 hands a new worktree to a fresh session; EnterWorktree
      # is only the fallback. Pins the printed hand-off and the fallback framing.
      - name: Run execute worktree hand-off suite
        run: bash scripts/test-execute-worktree-handoff.sh

      # #347: the post-fix /pre-merge re-run reads the post-stamp delta, decided
      # from branch state by a block in Phase 1 step 4, and /fix-findings' menu
      # counts rounds from a commit line. Both are executable prose; this runs
      # them in a fixture for every branch state the skill names as a fallback.
      - name: Run delta review scope contract suite
        run: bash scripts/test-delta-review-scope.sh

      # #617: /execute Step 0's parent-PRD amendment gate compares the PRD
      # body's lastEditedAt with the latest Decomposed-into comment. This runs
      # the extracted block against a stubbed gh for every verdict it names.
      - name: Run PRD amendment gate contract suite
        run: bash scripts/test-prd-amendment-gate.sh

      # #601: every sub-agent brief carries `sidecar.sh profile`, and no skill
      # restates the profile's fields. Self-checks by planting both defects.
      - name: Run profile paste-site contract suite
        run: bash scripts/test-profile-paste-sites.sh

      # #347's round: two instruments keyed on a bare `git ls-files` reported
      # clean on an unstaged file. This runs their extracted populations in a
      # fixture with a tracked, an untracked, and an ignored file.
      - name: Run population-covers-untracked contract suite
        run: bash scripts/test-population-covers-untracked.sh

      - name: Run compound re-stamp handoff contract suite
        run: bash scripts/test-compound-restamp-handoff.sh

      - name: Run prose-fix disposition contract suite
        run: bash scripts/test-prose-fix-disposition.sh

      - name: Run respond-to-review contract suite
        run: bash scripts/test-respond-to-review-contract.sh

      # /compound Phase 3 and /excavate Step 7 both write the docs/solutions/ entry
      # format, and /research Phase 3 reads `volatility` and `date` from every
      # entry. A key changed in one template leaves the other's entries malformed
      # with nothing failing; this extracts both key lists and compares them.
      - name: Run excavate entry-contract suite
        run: bash scripts/test-excavate-entry-contract.sh

      # /hackathon's State blocks are run, each in its own fresh shell (bash and
      # zsh), so a block that leans on an earlier block's variable fails here.
      - name: Run hackathon blocks suite
        run: bash scripts/test-hackathon-blocks.sh

      # sidecar.sh is the one place a sidecar path is computed or git is run
      # against one. This runs it against scratch repos: one identity across
      # main, worktree, and clone; 20 parallel commits land; a leaked GIT_DIR
      # never reaches the project.
      - name: Run sidecar resolution contract suite
        run: bash scripts/test-sidecar-resolution.sh

      # `sidecar.sh backend` is the routing rule docs/state-backend.md states, and
      # the `stamp` verbs are the sidecar twin of the PR-body review stamp. This
      # runs the truth table across owned/guest x forge kinds x no sidecar, and the
      # stamp round trips, against scratch repos.
      - name: Run state backend contract suite
        run: bash scripts/test-state-backend.sh

      # `sidecar.sh trace` reads edges out of text other skills write (the PRD
      # Research Reference section, review comments, a lesson's Related list).
      # This runs it against scratch sidecars, pins its research reader to
      # write-a-prd's template, and traces every docs/solutions lesson (#727).
      - name: Run sidecar trace suite
        run: bash scripts/test-sidecar-trace.sh

      # `sidecar.sh lessons match` finds a lesson by the files its `paths` line
      # names. This runs it against scratch repos, holds its three outcomes
      # apart, counts its processes at 3 and 30 lessons, and runs /execute
      # Step 1's lessons-start block under bash and zsh (#748).
      - name: Run lesson recall suite
        run: bash scripts/test-lesson-recall.sh

      # /pre-merge Phase 2's sidecar PR block and /closeout Step 3's merge,
      # extracted and run against a stubbed gh on a guest repo: neither may pass
      # the forge a pack marker (#526).
      - name: Run guest footprint contract suite
        run: bash scripts/test-guest-footprint.sh

      # /closeout Step 3's work-close block, extracted and run against a real
      # sidecar and a stubbed gh: the merged slice's work item reads closed (#695).
      - name: Run closeout work-close contract suite
        run: bash scripts/test-closeout-work-close.sh

      # /pre-merge Phase 2's github-backend PR block, extracted and run against a
      # stubbed gh: the declared base must reach --base; a failing base-ref aborts (#604).
      - name: Run github PR base contract suite
        run: bash scripts/test-github-pr-base.sh

      # /write-a-prd Step 8's fenced blocks, extracted and run (one shell each)
      # on the github, sidecar, and refusing-backend arms (#523).
      - name: Run write-a-prd sidecar branch contract suite
        run: bash scripts/test-write-a-prd-sidecar-branch.sh

      # /prd-to-issues' sidecar blocks (§§1, 7, 8, 9), extracted and run one
      # shell each: slice creation, the blocked_by read-back, decomposed_into
      # replacement, and the scoped next-slice pick or cycle report (#524).
      - name: Run prd-to-issues sidecar branch contract suite
        run: bash scripts/test-prd-to-issues-sidecar-branch.sh

      # Fenced bash/sh blocks in skill prose must not rely on bash word
      # splitting: agents run them in zsh. Known sites are listed with the
      # issue that owns them, and the list only shrinks.
      - name: Run skill-blocks zsh-safe scan
        run: bash scripts/test-skill-blocks-zsh-safe.sh

      # /handoff Step 3's path block, extracted and run: the path ends in .md
      # and carries no literal XXXXXX on this runner's mktemp (#581).
      - name: Run handoff mktemp contract suite
        run: bash scripts/test-handoff-mktemp.sh

      # A git hook exports GIT_DIR, and a suite that runs `git init` or
      # `git config` in a fixture without clearing it writes into the real repo
      # (#429: core.bare, core.hooksPath, a fixture [user]). This re-runs every
      # pre-push suite, read from lefthook.yml, from a scratch linked worktree
      # with GIT_DIR exported and fails on any change to its shared config,
      # refs, or HEAD. CI is the only place it runs; the suite header says why.
      - name: Run fixture git-isolation suite
        run: bash scripts/test-fixture-git-isolation.sh

      # sidecar.sh identifies a project by its root commit, so two fixtures
      # whose empty root commits differ only in a one-second timestamp are one
      # project. This re-runs every suite that runs `sidecar.sh init` with both
      # commit dates pinned, which turns that collision from intermittent into
      # certain (#526). CI only, like the suite above; its header says why.
      - name: Run fixture root-collision suite
        run: bash scripts/test-fixture-root-collision.sh

  # The canon section is generated from `sources:` frontmatter (issue #273). Every
  # other check reads source files and reasons about what they would produce; this
  # one builds the site and reads what was produced, which is the difference
  # between "the component imports the canon" and "the reader can see all of it".
  canon-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - name: Run canon-coverage contract suite against the built page
        run: bash scripts/test-canon-coverage.sh
