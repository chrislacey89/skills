name: Validate Skills

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md files
        run: |
          errors=0
          count=0

          for dir in */; do
            skill_file="${dir}SKILL.md"
            [ ! -f "$skill_file" ] && continue

            count=$((count + 1))
            dir_name="${dir%/}"

            # Check YAML frontmatter exists
            if ! head -1 "$skill_file" | grep -q '^---$'; then
              echo "ERROR: $skill_file missing YAML frontmatter"
              errors=$((errors + 1))
              continue
            fi

            # Extract frontmatter
            frontmatter=$(sed -n '2,/^---$/p' "$skill_file" | head -n -1)

            # Check name field
            name=$(echo "$frontmatter" | grep '^name:' | sed 's/name: *//')
            if [ -z "$name" ]; then
              echo "ERROR: $skill_file missing 'name' field"
              errors=$((errors + 1))
            elif [ "$name" != "$dir_name" ]; then
              echo "ERROR: $skill_file name '$name' does not match directory '$dir_name'"
              errors=$((errors + 1))
            fi

            # Check description field
            description=$(echo "$frontmatter" | grep '^description:')
            if [ -z "$description" ]; then
              echo "ERROR: $skill_file missing 'description' field"
              errors=$((errors + 1))
            fi
          done

          echo ""
          echo "Validated $count skills, $errors errors"

          if [ $errors -gt 0 ]; then
            exit 1
          fi

  check-skill-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundled skill references are in sync
        run: bash scripts/sync-skill-references.sh --check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          # Version comes from .shellcheck-version, the single source both this
          # job and lefthook read. Deliberately not restated here — see
          # scripts/check-shellcheck-version.sh for the incident behind the pin.
          want="$(tr -d '[:space:]' < .shellcheck-version)"
          sudo apt-get update && sudo apt-get install -y shellcheck
          got="$(shellcheck --version | awk -F': ' '/^version:/ {print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::.shellcheck-version pins $want but the runner installed $got." \
                 "Update .shellcheck-version deliberately, or pin the install."
            exit 1
          fi

      - name: Lint shell scripts
        run: git ls-files -z "*.sh" | xargs -0 shellcheck

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync-skill-references test suite
        run: bash scripts/test-sync-references.sh

      - name: Bundled reference pointers resolve
        run: bash scripts/test-bundled-pointer-resolution.sh

      - name: Run verify-install test suite
        run: bash scripts/test-verify-install.sh

      - name: Run review-currency marker contract suite
        run: bash scripts/test-review-currency-marker.sh

      - name: Run review-dimension partition contract suite
        run: bash scripts/test-review-dimension-partition.sh

      - name: Run restated review-operative contract suite
        run: bash scripts/test-restated-review-operatives.sh

      - name: Run loop-ledger marker contract suite
        run: bash scripts/test-loop-ledger-markers.sh

      - name: Run Context-block contract suite
        run: bash scripts/test-context-block-contract.sh

      - name: Run selection-idiom consistency suite
        run: bash scripts/test-selection-idiom-consistency.sh

      - name: Run options-comparison contract suite
        run: bash scripts/test-options-comparison-contract.sh

      - name: Run per-unit-series contract suite
        run: bash scripts/test-per-unit-series-contract.sh

      - name: Run documented git command contract suite
        run: bash scripts/test-documented-git-commands.sh

      - name: Run git guardrail contract suite
        run: bash scripts/test-git-guardrails.sh

      - name: Run compound clustering single-source suite
        run: bash scripts/test-compound-clustering-single-source.sh

      - name: Run Q4 mechanism-name contract suite
        run: bash scripts/test-q4-mechanism-names.sh

      - name: Run oracle-table coverage suite
        run: bash scripts/test-oracle-table-coverage.sh

      - name: Run duplicate-guard-program contract suite
        run: bash scripts/test-duplicate-guard-programs.sh

      - name: Run widened-domain tell contract suite
        run: bash scripts/test-widened-domain-tell.sh

      - name: Run canon-coverage contract suite
        run: bash scripts/test-canon-coverage.sh
        # NOTE: this run SKIPS the rendered-page check — site/dist does not exist
        # here. The canon-render job below builds the site first so that check
        # runs on every PR. Both invocations are deliberate: this one is fast and
        # covers everything readable from source, that one is slow and is the only
        # reading that sees the page a visitor gets.

      - name: Run shellcheck version-parity contract suite
        run: bash scripts/test-shellcheck-version-parity.sh

      - name: Run absent-local-gate tell contract suite
        run: bash scripts/test-absent-local-gate-tells.sh

      # Measures git's own behavior in a scratch repo rather than reading a file
      # in this one, so it is the one suite here that can go red because the
      # runner's git changed rather than because this repo did. That is the
      # point: CLAUDE.md states what `diff=markdown` does and does not do, and
      # nothing else would notice if a future git made half of it false.
      - name: Run markdown diff-attribute contract suite
        run: bash scripts/test-markdown-diff-attribute.sh

      # The mechanism for PR #296's escapes: a guard whose condition cannot
      # become true reports coverage while providing none, and is invisible in
      # exactly the way the defect it guards against is invisible.
      - name: Run guards-can-fire contract suite
        run: bash scripts/test-guards-can-fire.sh

      # The palette /visual-recap and /walk-commits copy is only copyable if it
      # covers the code being rendered. Where it did not, an agent invented a
      # token and repurposed another (#305) — while reading the rule forbidding
      # exactly that. Pins membership, symmetry, and that every token is shown
      # in use, which is the half a membership check alone would miss.
      - name: Run syntax-palette contract suite
        run: bash scripts/test-syntax-palette-contract.sh
      # #307's drift class: an always-on surface contradicting the doc it points
      # at. The `description:` frontmatter is in every downstream session's
      # context window, and it announced a diagram default the canon no longer
      # states. Five copies of one rule, none of them the canon.
      - name: Run recap mode + diagram default contract suite
        run: bash scripts/test-recap-mode-contract.sh

      # The decision card (#317) is the second forward-looking block, and the
      # first one whose subject is a plan. Its grounding rule is weaker than
      # every other block's by necessity — a plan has no diff, so "derived by
      # tooling" is replaced by "cited or visibly asserted" — and a weaker rule
      # that goes unenforced degrades to no rule while still looking confident.
      - name: Run decision card grounding contract suite
        run: bash scripts/test-decision-card-grounding.sh

      # A committed instrument that fails while reporting normally is the defect
      # docs/solutions/testing-patterns/validate-the-instrument-not-only-the-
      # subject-2026-08-23.md recorded as prose. This is its mechanizable half:
      # `producer | grep -q` under pipefail answers "not found" for text that is
      # there, so a ban goes green precisely when the banned thing is present.
      - name: Run pipefail-safe matcher suite
        run: bash scripts/test-pipefail-safe-matchers.sh

      # #327's lock is one hook clause plus four runnable blocks in four files,
      # and nothing executed any of it: `rg -l review-stamped scripts/` and
      # `rg -l "enforce-classification|IMPL_PATTERNS" scripts/` were both empty.
      # Its silent failure direction is a lock that never engages, which from
      # outside is indistinguishable from a branch nobody edited after review.
      - name: Run post-review edit lock contract suite
        run: bash scripts/test-post-review-edit-lock.sh

      # #347: the post-fix /pre-merge re-run reads the post-stamp delta, decided
      # from branch state by a block in Phase 1 step 4, and /fix-findings' menu
      # counts rounds from a commit line. Both are executable prose; this runs
      # them in a fixture for every branch state the skill names as a fallback.
      - name: Run delta review scope contract suite
        run: bash scripts/test-delta-review-scope.sh

      # #347's round: two instruments keyed on a bare `git ls-files` reported
      # clean on an unstaged file. This runs their extracted populations in a
      # fixture with a tracked, an untracked, and an ignored file.
      - name: Run population-covers-untracked contract suite
        run: bash scripts/test-population-covers-untracked.sh

  # The canon section is generated from `sources:` frontmatter (issue #273). Every
  # other check reads source files and reasons about what they would produce; this
  # one builds the site and reads what was produced, which is the difference
  # between "the component imports the canon" and "the reader can see all of it".
  canon-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - name: Run canon-coverage contract suite against the built page
        run: bash scripts/test-canon-coverage.sh
