# Lefthook — local git hooks. Install with `brew install lefthook` (or see
# https://github.com/evilmartians/lefthook for other platforms), then run
# `lefthook install` once per clone. Hooks run from CI regardless, so local
# lefthook is an early-warning layer, not a gate.
#
# Pre-commit is kept to the cheap checks (<1s). The full test suites run on
# pre-push so a bad commit can still be fixed up locally without rewriting
# against CI.

pre-commit:
  parallel: true
  commands:
    sync-references-check:
      run: bash scripts/sync-skill-references.sh --check
    shellcheck-version:
      run: bash scripts/check-shellcheck-version.sh
    shellcheck:
      glob: "scripts/*.sh"
      run: shellcheck {staged_files}
    # Cheap (<1s) and catches the one-file case at the moment it happens: a
    # SKILL.md's sources: block changed and site/src/lib/canon.generated.ts was
    # not regenerated. The full canon suite runs on pre-push and in CI.
    canon-freshness:
      run: bash scripts/generate-canon.sh --check

pre-push:
  parallel: true
  commands:
    sync-script-tests:
      run: bash scripts/test-sync-references.sh
    verify-install-script-tests:
      run: bash scripts/test-verify-install.sh
    review-currency-marker-tests:
      run: bash scripts/test-review-currency-marker.sh
    loop-ledger-marker-tests:
      run: bash scripts/test-loop-ledger-markers.sh
    context-block-contract-tests:
      run: bash scripts/test-context-block-contract.sh
    selection-idiom-consistency-tests:
      run: bash scripts/test-selection-idiom-consistency.sh
    options-comparison-contract-tests:
      run: bash scripts/test-options-comparison-contract.sh
    documented-git-command-tests:
      run: bash scripts/test-documented-git-commands.sh
    compound-clustering-single-source-tests:
      run: bash scripts/test-compound-clustering-single-source.sh
    q4-mechanism-name-tests:
      run: bash scripts/test-q4-mechanism-names.sh
    oracle-table-coverage-tests:
      run: bash scripts/test-oracle-table-coverage.sh
    duplicate-guard-program-tests:
      run: bash scripts/test-duplicate-guard-programs.sh
    widened-domain-tell-tests:
      run: bash scripts/test-widened-domain-tell.sh
    canon-coverage-tests:
      run: bash scripts/test-canon-coverage.sh
    absent-local-gate-tell-tests:
      run: bash scripts/test-absent-local-gate-tells.sh
    shellcheck-version-parity-tests:
      run: bash scripts/test-shellcheck-version-parity.sh
    shellcheck-all:
      run: shellcheck scripts/*.sh
