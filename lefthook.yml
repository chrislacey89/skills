# Lefthook — local git hooks. Install with `brew install lefthook` (or see
# https://github.com/evilmartians/lefthook for other platforms), then run
# `lefthook install` once per clone. Hooks run from CI regardless, so local
# lefthook is an early-warning layer, not a gate.
#
# Pre-commit is kept to the cheap checks (<1s). Pre-push runs the suites that
# read what the push changes, so a bad commit can still be fixed up locally
# without rewriting against CI, which runs every suite.

pre-commit:
  parallel: true
  commands:
    sync-references-check:
      run: bash scripts/sync-skill-references.sh --check
    shellcheck-version:
      run: bash scripts/check-shellcheck-version.sh
    shellcheck:
      glob: "**/*.sh"
      run: shellcheck {staged_files}
    # Cheap (<1s) and catches the one-file case at the moment it happens: a
    # SKILL.md's sources: block changed and site/src/lib/canon.generated.ts was
    # not regenerated. The full canon suite runs on pre-push and in CI.
    canon-freshness:
      run: bash scripts/generate-canon.sh --check
    # The one suite cheap enough for pre-commit. test-bare-pack-refs.sh is over
    # the line, so it waits for pre-push.
    pipefail-safe-matchers:
      run: bash scripts/test-pipefail-safe-matchers.sh

pre-push:
  parallel: true
  commands:
    # The suites that read what this push changes, plus scripts/suites-always.txt.
    # A new suite is registered in .github/workflows/validate-skills.yml, and in
    # that list when it reaches files through a glob; it needs no line here.
    # scripts/test-fixture-git-isolation.sh and
    # scripts/test-fixture-root-collision.sh are deliberately absent: both re-run
    # other suites, so they run in CI only (#442, #526) and the runner skips them.
    # The whole local run by hand: bash scripts/run-changed-suites.sh --all
    changed-suites:
      run: bash scripts/run-changed-suites.sh
    skill-inventory-check:
      run: bash scripts/check-skill-inventory.sh
    shellcheck-all:
      # Runs the *pinned* shellcheck (cached download on first use), because a
      # PATH shellcheck of a different version is a different instrument — the
      # warner announces that; this actually closes it. See the script header.
      run: bash scripts/shellcheck-pinned.sh
